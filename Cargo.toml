[package]
name = "mail"
version = "0.1.3"
edition = "2021"
description = "An email address for each agent on Pointman, receiving only: Cloudflare Email Routing to an Email Worker, posted to the agent from Workers KV."
license = "MIT"
repository = "https://github.com/pointman-ai/pointman-mail"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
# buffa's code for proto/mail/v1/mail.proto (build.rs) uses it: keep it at the SDK's version
buffa = { version = "0.9.2", features = ["json"] }
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", rev = "27dd5d9" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[build-dependencies]
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", rev = "27dd5d9", features = ["proto"] }

[dev-dependencies]
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", rev = "27dd5d9", features = ["proto"] }
regex = "1"
toml = "0.8"

[profile.release]
strip = true
lto = true
