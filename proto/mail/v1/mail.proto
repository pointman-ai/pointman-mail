// The mail extension's commands and settings: the source of extension.toml's `params` and `[settings]` schemas.
// Command `mail.<verb>` takes `<Verb>Params` and answers `<Verb>Result`. A field's comment is its description, and
// its buf.validate rules are its limits.
syntax = "proto3";

package mail.v1;

import "buf/validate/validate.proto";

// The extension's settings, per machine. Run mail.setup again after changing daily or max_chars: the Worker reads them.
message Settings {
  // The domain agents' addresses are on: each is <handle>@<domain> (james.pointman.network). Cloudflare's Email Routing must be on for it.
  string domain = 1 [(buf.validate.field).string = {max_len: 64, pattern: "^([a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+)?$"}];
  // The Worker's name at Cloudflare, and its KV namespace's title. Empty: pointman-mail.
  string worker = 2 [(buf.validate.field).string = {max_len: 63, pattern: "^([a-z0-9][a-z0-9-]*)?$"}];
  // Mails a day one address takes; the rest are refused. 0: 50.
  int32 daily = 3 [(buf.validate.field).int32 = {gte: 0, lte: 300}];
  // A mail's text kept, in characters; the rest is cut and the post says so. 0: 20000.
  int32 max_chars = 4 [(buf.validate.field).int32 = {gte: 0, lte: 30000}];
}

// mail.claim: an agent's own address, <handle>@<domain>, with its mail posted in a thread. Claim only your own.
message ClaimParams {
  // The agent's handle, without the @ (atlas): the address is atlas@<domain>. It must be an agent this machine runs.
  string agent = 1 [(buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^[a-z0-9][a-z0-9_-]*$"}];
  // The thread its mail is posted in (thr_123 or 123). Everyone in that thread reads the mail: pick one meant for it.
  string thread = 2 [(buf.validate.field).string = {min_len: 1, max_len: 24, pattern: "^(thr_)?[1-9][0-9]*$"}];
}

message ClaimResult {
  string text = 1;
  // The address it now takes mail at.
  string address = 2;
  // Cloudflare's id for its routing rule.
  string rule = 3;
}

// mail.release: an agent's address goes, with the mail waiting for it. Release only your own.
message ReleaseParams {
  // The agent's handle, without the @.
  string agent = 1 [(buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^[a-z0-9][a-z0-9_-]*$"}];
}

message ReleaseResult {
  string text = 1;
  string address = 2;
  // How many waiting mails were deleted with it.
  int32 deleted = 3;
}

// mail.addresses: every agent with an address, and the thread its mail goes to.
message AddressesParams {}

message AddressesResult {
  string text = 1;
  repeated Address addresses = 2;
}

message Address {
  string agent = 1;
  string address = 2;
  // Where its mail is posted (thr_123).
  string thread = 3;
}

// mail.setup: the Worker that takes the mail and its KV namespace, made or brought up to date at Cloudflare.
message SetupParams {}

message SetupResult {
  string text = 1;
  string worker = 2;
  // The KV namespace's id.
  string namespace = 3;
  // Whether the namespace was made just now.
  bool made = 4;
}

// mail.status: whether the Worker, its KV namespace and the domain's mail records are there, and today's numbers.
message StatusParams {}

message StatusResult {
  string text = 1;
  bool worker = 2;
  bool namespace = 3;
  // The domain's MX records point at Cloudflare.
  bool takes_mail = 4;
  int32 addresses = 5;
  // Mails waiting at Cloudflare to be posted.
  int32 waiting = 6;
  // What's missing, each in words a person can act on.
  repeated string missing = 7;
}

// mail.add: the Cloudflare API token, account id and zone id, added in the apps.
message AddParams {}

message AddResult {
  string text = 1;
}
